<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" style="position: relative; width: 100%; font-family: 'Nunito Sans', sans-serif;">
  <button type="button" id="{{ id }}" aria-haspopup="listbox" aria-expanded="{{ open }}" aria-label="{{ ariaLabel }}" disabled="{{ disabled }}" onClick="{{ toggle }}" onKeyDown="{{ onTriggerKey }}" style="{{ triggerStyle }}" style-focus="outline: none; border-color: #4B4B49;">
    <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;">{{ displayText }}</span>
    <img src="assets/icons/c/chevron_down_outlined_24-dark.svg" alt="" aria-hidden="true" width="{{ chevSize }}" height="{{ chevSize }}" style="{{ chevStyle }}">
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <ul role="listbox" aria-label="{{ ariaLabel }}" style="position: absolute; top: calc(100% + 8px); left: 0; min-width: 100%; max-height: 288px; overflow: auto; margin: 0; padding: 8px 0; list-style: none; background: #FFFFFF; border-radius: 8px; box-shadow: 0 8px 24px rgba(31,30,30,0.16); z-index: 40; box-sizing: border-box;">
      <sc-for list="{{ items }}" as="opt" hint-placeholder-count="3">
        <li role="option" aria-selected="{{ opt.selected }}" aria-disabled="{{ opt.disabled }}" onClick="{{ opt.pick }}" onMouseEnter="{{ opt.hover }}" style="{{ opt.style }}">
          <span style="flex: 1; white-space: nowrap;">{{ opt.label }}</span>
          <sc-if value="{{ opt.meta }}" hint-placeholder-val="{{ false }}">
            <span style="font-size: 12px; color: #6E6E6D; white-space: nowrap;">{{ opt.meta }}</span>
          </sc-if>
          <sc-if value="{{ opt.selected }}" hint-placeholder-val="{{ false }}">
            <img src="assets/icons/c/checkmark_outlined_24-blue.svg" alt="" aria-hidden="true" width="16" height="16" style="display: block; flex-shrink: 0; flex-shrink: 0;">
          </sc-if>
        </li>
      </sc-for>
    </ul>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:360},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Select Category&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;string|{label:string,value:string,disabled?:boolean,meta?:string}&gt;&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value:string)=&gt;void&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;medium&quot;,&quot;small&quot;],&quot;default&quot;:&quot;medium&quot;,&quot;tsType&quot;:&quot;'medium'|'small'&quot;},&quot;ariaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;id&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, active: -1 };
  rootRef = React.createRef();
  componentDidMount() {
    this._onDoc = (e) => { if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('mousedown', this._onDoc);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this._onDoc); }
  opts() { return (this.props.options || []).map(o => typeof o === 'string' ? { label: o, value: o } : o); }
  pick(o) { if (o.disabled) return; this.setState({ open: false }); this.props.onChange && this.props.onChange(o.value); }
  onTriggerKey = (e) => {
    const opts = this.opts();
    if (e.key === 'Escape') { this.setState({ open: false }); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const dir = e.key === 'ArrowDown' ? 1 : -1;
      let i = this.state.open ? this.state.active : opts.findIndex(o => o.value === this.props.value);
      for (let n = 0; n < opts.length; n++) { i = (i + dir + opts.length) % opts.length; if (!opts[i].disabled) break; }
      this.setState({ open: true, active: i });
    }
    if ((e.key === 'Enter' || e.key === ' ') && this.state.open && this.state.active >= 0) { e.preventDefault(); this.pick(opts[this.state.active]); }
  };
  renderVals() {
    const p = this.props;
    const size = p.size || 'medium';
    const opts = this.opts();
    const sel = opts.find(o => o.value === p.value);
    const has = !!sel;
    const small = size === 'small';
    const border = p.disabled ? '1px solid #C2C1C0' : this.state.open ? '1px solid #4B4B49' : has && !small ? '1.5px solid #1F1E1E' : '1px solid #7D7C7C';
    const triggerStyle = {
      display: 'flex', alignItems: 'center', gap: 8, width: '100%', height: small ? 40 : 48,
      padding: small ? '0 16px' : '0 16px', boxSizing: 'border-box', background: '#FFFFFF',
      border, borderRadius: small ? 8 : 10, cursor: p.disabled ? 'not-allowed' : 'pointer',
      fontFamily: "'Nunito Sans', sans-serif", fontSize: 14, lineHeight: '24px',
      color: p.disabled ? '#A3A2A2' : has ? '#1F1E1E' : small ? '#000000' : '#4B4B49'
    };
    return {
      rootRef: this.rootRef,
      id: p.id,
      ariaLabel: p.accessibleLabel || p.ariaLabel || p.placeholder,
      disabled: !!p.disabled,
      open: this.state.open,
      displayText: has ? sel.label : (p.placeholder || 'Select'),
      triggerStyle,
      chevSize: small ? 16 : 24,
      chevStyle: { display: 'block', flexShrink: 0, opacity: p.disabled ? 0.4 : 1, transform: this.state.open ? 'rotate(180deg)' : 'none', transition: 'transform 150ms ease' },
      toggle: () => { if (!p.disabled) this.setState(s => ({ open: !s.open, active: opts.findIndex(o => o.value === p.value) })); },
      onTriggerKey: this.onTriggerKey,
      items: opts.map((o, i) => ({
        label: o.label, meta: o.meta || '', selected: o.value === p.value, disabled: !!o.disabled,
        pick: () => this.pick(o),
        hover: () => this.setState({ active: i }),
        style: {
          display: 'flex', alignItems: 'center', gap: 16, minHeight: 40, padding: '8px 16px', boxSizing: 'border-box',
          fontSize: 14, lineHeight: '24px', cursor: o.disabled ? 'not-allowed' : 'pointer',
          color: o.disabled ? '#A3A2A2' : '#1F1E1E', fontWeight: o.value === p.value ? 700 : 400,
          background: i === this.state.active && !o.disabled ? '#EBF3F9' : 'transparent'
        }
      }))
    };
  }
}
</script>
</body>
</html>
